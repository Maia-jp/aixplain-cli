[package]
name = "aixplain-cli"
version = "0.1.0"
edition = "2021"
authors = ["aiXplain Engineering"]
description = "Terminal interface for the aiXplain AI platform"
license = "Apache-2.0"
repository = "https://github.com/aixplain/aixplain-cli"
keywords = ["ai", "cli", "tui", "aixplain", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "aix"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }

# HTTP
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "2"

# Config
toml = "0.8"
dirs = "6"
dotenvy = "0.15"

# CLI output
comfy-table = "7"
console = "0.15"
indicatif = "0.17"

# TUI (feature-gated for later)
ratatui = "0.29"
crossterm = "0.28"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
mime_guess = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
